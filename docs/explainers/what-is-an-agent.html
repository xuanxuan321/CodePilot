<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>什么是 Agent？</title>
<style>
  :root {
    --ink: #14161a;
    --muted: #6b7280;
    --line: #e3e6ec;
    --card: #ffffff;
    --brand: #4f46e5;
    --brand-soft: #eef0ff;
    --accent: #f59e0b;
    --green: #10b981;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1000px 600px at 12% -10%, #eef0ff 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 0%, #fff4e0 0%, transparent 55%),
      #f7f8fb;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  .eyebrow {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--brand);
    background: var(--brand-soft);
    border-radius: 999px;
    padding: 6px 14px;
  }

  h1 {
    font-size: clamp(34px, 6vw, 62px);
    line-height: 1.15;
    margin: 18px 0 10px;
    letter-spacing: -.02em;
  }

  .lede {
    font-size: clamp(17px, 2.2vw, 22px);
    color: var(--muted);
    margin: 0;
    max-width: 40ch;
  }

  .lede b { color: var(--ink); font-weight: 600; }

  .stage {
    margin: 40px 0 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 20px 16px 8px;
    box-shadow: 0 24px 60px -30px rgba(20, 22, 26, .28);
    overflow: hidden;
  }

  .stage svg { display: block; width: 100%; height: auto; }

  .caption {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    padding: 4px 12px 16px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 28px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px 24px;
    box-shadow: 0 18px 40px -32px rgba(20, 22, 26, .35);
  }

  .card .face { font-size: 46px; line-height: 1; }

  .card h3 { margin: 14px 0 6px; font-size: 20px; }

  .card p { margin: 0; color: var(--muted); font-size: 16px; }

  .card.is-agent { border-color: #cfcaff; background: linear-gradient(180deg, #fbfaff, #fff); }

  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 28px;
  }

  .chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 15px;
    box-shadow: 0 8px 20px -18px rgba(20, 22, 26, .5);
  }

  .chip span { margin-right: 6px; }

  .kicker {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 34px;
  }

  .punch {
    margin-top: 14px;
    text-align: center;
    font-size: clamp(20px, 3.2vw, 30px);
    font-weight: 650;
    letter-spacing: -.01em;
  }

  .punch em { font-style: normal; color: var(--brand); }

  .stage svg.wide-only { display: block; }
  .stage svg.narrow-only { display: none; }

  .dash { stroke-dasharray: 10 8; animation: run 1.4s linear infinite; }

  @keyframes run { to { stroke-dashoffset: -18; } }

  @media (prefers-reduced-motion: reduce) {
    .dash { animation: none; }
  }

  /* 窄屏下横排大图会缩到看不清，改用竖排的同一张图 */
  @media (max-width: 760px) {
    .stage svg.wide-only { display: none; }
    .stage svg.narrow-only { display: block; }
  }

  @media (max-width: 640px) {
    .wrap { padding: 36px 16px 72px; }
    .row { grid-template-columns: 1fr; }
    .stage { border-radius: 20px; padding: 12px 8px 4px; }
  }
</style>
</head>
<body>
<main class="wrap">

  <span class="eyebrow">一张图看懂</span>
  <h1>什么是 Agent？</h1>
  <p class="lede">一个<b>会自己动手把事做完</b>的 AI。<br />你说要什么，它自己想、自己做、自己检查。</p>

  <section class="stage">
    <svg class="wide-only" viewBox="0 0 1200 470" role="img"
         aria-label="流程图：你的一句话交给 Agent，Agent 依次思考、动手、检查，做好了就交出成果，没做好就自己再来一遍。">
      <defs>
        <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6366f1" />
          <stop offset="1" stop-color="#4338ca" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#9aa2b1" />
        </marker>
        <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b" />
        </marker>
      </defs>

      <!-- 小标注：三步各自在做什么 -->
      <g font-size="16" fill="#8b93a3" text-anchor="middle">
        <text x="365" y="96">听懂你要什么</text>
        <text x="575" y="96">真的去操作</text>
        <text x="785" y="96">对不对？</text>
      </g>

      <!-- 输入：你的一句话 -->
      <g>
        <rect x="24" y="148" width="212" height="114" rx="24" fill="#fff" stroke="#d7dbe4" stroke-width="2" />
        <text x="130" y="188" font-size="34" text-anchor="middle">🙋</text>
        <text x="130" y="226" font-size="18" font-weight="600" text-anchor="middle" fill="#14161a">你说一句话</text>
        <text x="130" y="249" font-size="14" text-anchor="middle" fill="#8b93a3">“帮我把这件事搞定”</text>
      </g>
      <path d="M248 205 H 296" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow)" />

      <!-- 三步循环 -->
      <g>
        <circle cx="365" cy="205" r="63" fill="url(#g-brand)" />
        <text x="365" y="192" font-size="30" text-anchor="middle">🧠</text>
        <text x="365" y="238" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">想</text>
      </g>
      <path class="dash" d="M436 205 H 504" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow)" />

      <g>
        <circle cx="575" cy="205" r="63" fill="url(#g-brand)" />
        <text x="575" y="192" font-size="30" text-anchor="middle">🛠️</text>
        <text x="575" y="238" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">做</text>
      </g>
      <path class="dash" d="M646 205 H 714" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow)" />

      <g>
        <circle cx="785" cy="205" r="63" fill="url(#g-brand)" />
        <text x="785" y="192" font-size="30" text-anchor="middle">🔍</text>
        <text x="785" y="238" font-size="21" font-weight="700" text-anchor="middle" fill="#fff">看</text>
      </g>
      <path d="M856 205 H 926" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow)" />

      <!-- 输出：做好的结果 -->
      <g>
        <rect x="938" y="148" width="238" height="114" rx="24" fill="#ecfdf5" stroke="#a7e8cd" stroke-width="2" />
        <text x="1057" y="188" font-size="34" text-anchor="middle">🎁</text>
        <text x="1057" y="226" font-size="18" font-weight="600" text-anchor="middle" fill="#0f7a5a">事情已经办好了</text>
        <text x="1057" y="249" font-size="14" text-anchor="middle" fill="#4b9c85">不是告诉你怎么办</text>
      </g>

      <!-- 回环：没做好就自己再来一遍 -->
      <path d="M785 276 C 785 404, 365 404, 365 278"
            stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"
            marker-end="url(#arrow-loop)" />
      <rect x="452" y="358" width="248" height="40" rx="20" fill="#fff8ec" stroke="#f8d99a" />
      <text x="576" y="384" font-size="16" font-weight="600" text-anchor="middle" fill="#a25f04">
        没做好？自己再来一遍
      </text>
      <text x="576" y="440" font-size="15" text-anchor="middle" fill="#8b93a3">
        这个圈会一直转，直到事情真的完成
      </text>
    </svg>

    <!-- 窄屏：同一张图，竖着排 -->
    <svg class="narrow-only" viewBox="0 0 420 880" role="img"
         aria-label="流程图：你的一句话交给 Agent，Agent 依次思考、动手、检查，做好了就交出成果，没做好就自己再来一遍。">
      <defs>
        <linearGradient id="g-brand-v" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6366f1" />
          <stop offset="1" stop-color="#4338ca" />
        </linearGradient>
        <marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#9aa2b1" />
        </marker>
        <marker id="arrow-loop-v" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b" />
        </marker>
      </defs>

      <g>
        <rect x="92" y="18" width="238" height="104" rx="22" fill="#fff" stroke="#d7dbe4" stroke-width="2" />
        <text x="211" y="56" font-size="30" text-anchor="middle">🙋</text>
        <text x="211" y="88" font-size="17" font-weight="600" text-anchor="middle" fill="#14161a">你说一句话</text>
        <text x="211" y="109" font-size="13" text-anchor="middle" fill="#8b93a3">“帮我把这件事搞定”</text>
      </g>
      <path d="M211 128 V 166" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow-v)" />

      <g>
        <circle cx="211" cy="235" r="62" fill="url(#g-brand-v)" />
        <text x="211" y="224" font-size="28" text-anchor="middle">🧠</text>
        <text x="211" y="266" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">想</text>
        <text x="288" y="240" font-size="14" fill="#8b93a3">听懂你要什么</text>
      </g>
      <path class="dash" d="M211 301 V 341" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow-v)" />

      <g>
        <circle cx="211" cy="410" r="62" fill="url(#g-brand-v)" />
        <text x="211" y="399" font-size="28" text-anchor="middle">🛠️</text>
        <text x="211" y="441" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">做</text>
        <text x="288" y="415" font-size="14" fill="#8b93a3">真的去操作</text>
      </g>
      <path class="dash" d="M211 476 V 516" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow-v)" />

      <g>
        <circle cx="211" cy="585" r="62" fill="url(#g-brand-v)" />
        <text x="211" y="574" font-size="28" text-anchor="middle">🔍</text>
        <text x="211" y="616" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">看</text>
        <text x="288" y="590" font-size="14" fill="#8b93a3">对不对？</text>
      </g>
      <path d="M211 651 V 694" stroke="#9aa2b1" stroke-width="3" fill="none" marker-end="url(#arrow-v)" />

      <g>
        <rect x="80" y="702" width="262" height="108" rx="22" fill="#ecfdf5" stroke="#a7e8cd" stroke-width="2" />
        <text x="211" y="742" font-size="30" text-anchor="middle">🎁</text>
        <text x="211" y="775" font-size="17" font-weight="600" text-anchor="middle" fill="#0f7a5a">事情已经办好了</text>
        <text x="211" y="796" font-size="13" text-anchor="middle" fill="#4b9c85">不是告诉你怎么办</text>
      </g>

      <path d="M147 585 C 40 570, 40 250, 147 235"
            stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"
            marker-end="url(#arrow-loop-v)" />

      <rect x="80" y="826" width="262" height="40" rx="20" fill="#fff8ec" stroke="#f8d99a" />
      <text x="211" y="852" font-size="15" font-weight="600" text-anchor="middle" fill="#a25f04">
        🔁 没做好？自己再来一遍
      </text>
    </svg>
  </section>
  <p class="caption">Agent = 一个 <b>会转圈</b> 的 AI：想 → 做 → 看，不满意就重来。</p>

  <div class="row">
    <div class="card">
      <div class="face">💬</div>
      <h3>普通 AI 聊天</h3>
      <p>给你一份菜谱。<br />菜还得你自己做。</p>
    </div>
    <div class="card is-agent">
      <div class="face">👨‍🍳</div>
      <h3>Agent</h3>
      <p>直接把菜做好端上桌。<br />中间咸了淡了，它自己调。</p>
    </div>
  </div>

  <p class="kicker">它之所以能“动手”，是因为手里有工具</p>
  <div class="tools">
    <div class="chip"><span>📂</span>看文件</div>
    <div class="chip"><span>✏️</span>改代码</div>
    <div class="chip"><span>⌨️</span>跑命令</div>
    <div class="chip"><span>🌐</span>查网页</div>
    <div class="chip"><span>📮</span>发消息</div>
  </div>

  <p class="punch">你负责说要什么，<em>Agent 负责把它变成现实</em>。</p>

</main>
</body>
</html>
